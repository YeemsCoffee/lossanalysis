{% extends "base.html" %}
{% block title %}Forgot Password · Loss Analysis · Yeems Coffee{% endblock %}

{% block content %}
<div class="upload-hero" style="padding-bottom: 20px;">
  <h1>Forgot Password</h1>
  <p>Enter your email and we'll send you a reset link.</p>
</div>

<div class="upload-card">
  <form method="post" action="{{ url_for('main.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field-group">
      <label class="field-label" for="email">Email address</label>
      <input class="field-input" type="email" id="email" name="email"
             required autocomplete="email" autofocus>
    </div>
    <button class="btn" type="submit">Send Reset Link</button>
  </form>
  <div class="target-note" style="margin-top: 20px;">
    <a href="{{ url_for('main.login') }}" style="color:var(--green); font-weight:700; text-decoration:none;">
      ← Back to sign in
    </a>
  </div>
</div>
{% endblock %}
