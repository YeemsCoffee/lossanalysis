{% extends "base.html" %}
{% block title %}Reset Password · Loss Analysis · Yeems Coffee{% endblock %}

{% block content %}
<div class="upload-hero" style="padding-bottom: 20px;">
  <h1>Reset Password</h1>
  <p>Choose a new password for your account.</p>
</div>

<div class="upload-card">
  <form method="post" action="{{ url_for('main.reset_password', token=token) }}">
    <div class="field-group">
      <label class="field-label" for="password">New Password</label>
      <input class="field-input" type="password" id="password" name="password"
             required minlength="8" autofocus placeholder="At least 8 characters">
    </div>
    <div class="field-group">
      <label class="field-label" for="confirm">Confirm Password</label>
      <input class="field-input" type="password" id="confirm" name="confirm"
             required minlength="8" placeholder="Same password again">
    </div>
    <button class="btn" type="submit">Set New Password</button>
  </form>
</div>
{% endblock %}
