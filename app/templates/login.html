{% extends "base.html" %}
{% block title %}Sign In · Loss Analysis · Yeems Coffee{% endblock %}

{% block content %}
<div class="upload-hero" style="padding-bottom: 20px;">
  <h1>Loss Analysis</h1>
  <p>Sign in to access your kitchen performance dashboard.</p>
</div>

<div class="upload-card">
  <form method="post" action="{{ url_for('main.login', next=request.args.get('next', '')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field-group">
      <label class="field-label" for="email">Email address</label>
      <input class="field-input" type="email" id="email" name="email"
             required autocomplete="email" autofocus
             value="{{ request.form.get('email', '') }}">
    </div>

    <div class="field-group">
      <label class="field-label" for="password">Password</label>
      <input class="field-input" type="password" id="password" name="password"
             required autocomplete="current-password">
    </div>

    <div style="display:flex; align-items:center; gap:10px; margin-top:12px; font-size:14px; color:var(--gray);">
      <input type="checkbox" id="remember" name="remember"
             style="width:16px; height:16px; accent-color:var(--green); cursor:pointer;">
      <label for="remember" style="cursor:pointer;">Keep me signed in</label>
    </div>

    <button class="btn" type="submit">Sign In</button>
  </form>
  <div class="target-note" style="margin-top: 20px;">
    <a href="{{ url_for('main.forgot_password') }}"
       style="color:var(--green); font-weight:700; text-decoration:none;">
      Forgot your password?
    </a>
  </div>
</div>
{% endblock %}
