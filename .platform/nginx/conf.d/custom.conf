client_max_body_size 64M;

# Keep these in step with the gunicorn --timeout in Procfile. nginx defaults to
# 60s, so with gunicorn set to 120s nginx would give up first and return a 504
# while the worker was still happily running — an error with no trace of a
# cause in the application log.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
